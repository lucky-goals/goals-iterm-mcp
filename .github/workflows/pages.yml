name: Deploy project website
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/check_site.py', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'scripts/check_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check website metadata and local links
        run: python3 scripts/check_site.py
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
