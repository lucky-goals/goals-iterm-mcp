[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goals-iterm-mcp"
version = "0.2.0"
description = "MCP tools backed by the iTerm2 Python API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp==1.30.0",
  "iterm2==2.30",
]

[project.urls]
Repository = "https://github.com/lucky-goals/goals-iterm-mcp"
Issues = "https://github.com/lucky-goals/goals-iterm-mcp/issues"

[project.scripts]
goals-iterm-mcp = "goals_iterm_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
